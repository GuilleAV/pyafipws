# This workflow builds the legacy Windows installer with local Python 2.7 x64.
# It requires a self-hosted Windows x64 runner with C:\Python27 and NSIS installed.

name: Windows Installer

on:
  push:
  workflow_dispatch:

jobs:
  compile:
    name: compile (Python 2.7, x64)
    runs-on: [self-hosted, Windows, X64]

    env:
      PY27: C:\Python27\python.exe
      PIP27: C:\Python27\Scripts\pip.exe
      MAKENSIS: C:\Program Files (x86)\NSIS\makensis.exe

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Verify Python 2.7 x64 toolchain
      shell: powershell
      run: |
        if (!(Test-Path $env:PY27)) { throw "Python 2.7 not found at $env:PY27" }
        if (!(Test-Path $env:PIP27)) { throw "pip for Python 2.7 not found at $env:PIP27" }
        if (!(Test-Path $env:MAKENSIS)) { throw "NSIS makensis not found at $env:MAKENSIS" }
        $env:Path = "C:\Python27;C:\Python27\Scripts;C:\Program Files (x86)\NSIS;$env:Path"
        & $env:PY27 --version
        & $env:PY27 -c "import sys, struct; assert sys.version_info[:2] == (2, 7); assert struct.calcsize('P') * 8 == 64; print('Python 2.7 x64 ok')"
        & $env:PY27 -c "import py2exe, win32com; print('py2exe and pywin32 ok')"

    - name: Install Python 2.7 dependencies
      shell: powershell
      run: |
        $env:Path = "C:\Python27;C:\Python27\Scripts;$env:Path"
        & $env:PIP27 install --trusted-host pypi.org --trusted-host pypi.python.org --trusted-host files.pythonhosted.org -r requirements.txt
        & $env:PIP27 install --trusted-host pypi.org --trusted-host pypi.python.org --trusted-host files.pythonhosted.org cachetools pefile

    - name: Remove stale installed PyAfipWs packages
      shell: powershell
      run: |
        Remove-Item C:\Python27\Lib\site-packages\pyafipws -Recurse -Force -ErrorAction SilentlyContinue
        Remove-Item C:\Python27\Lib\site-packages\PyAfipWs-*.egg -Recurse -Force -ErrorAction SilentlyContinue
        Remove-Item C:\Python27\Lib\site-packages\PyAfipWs-*.dist-info -Recurse -Force -ErrorAction SilentlyContinue

    - name: Install package
      shell: powershell
      run: |
        $env:Path = "C:\Python27;C:\Python27\Scripts;$env:Path"
        & $env:PY27 setup.py install
        & $env:PY27 -c "import pyafipws, pyafipws.utils; print(pyafipws.__file__); print(pyafipws.utils.__file__); assert hasattr(pyafipws.utils, 'date')"

    - name: Build executables
      shell: powershell
      run: |
        $env:Path = "C:\Python27;C:\Python27\Scripts;C:\Program Files (x86)\NSIS;$env:Path"
        & $env:PY27 setup_win.py py2exe

    - name: List dist folder contents
      shell: powershell
      run: |
        Get-ChildItem -Recurse .\dist

    - name: Download Visual Studio Redistributable x64
      shell: powershell
      run: |
        curl.exe -L https://aka.ms/vs/17/release/vc_redist.x64.exe -o vcredist.exe

    - name: Copy Visual Studio Redistributable
      shell: powershell
      run: |
        Copy-Item vcredist.exe .\dist\

    - name: Build PyAfipWs Installer
      shell: powershell
      run: |
        & $env:MAKENSIS base.nsi

    - name: Remove uneeded libs (TK)
      shell: powershell
      run: |
        Remove-Item .\dist\lib\tcl -Recurse -ErrorAction SilentlyContinue
        Remove-Item .\dist\lib\tk -Recurse -ErrorAction SilentlyContinue

    - name: Copy PowerShell tests into the release artifact
      shell: powershell
      run: |
        New-Item -ItemType Directory -Force .\dist\tests
        Copy-Item .\tests\powershell\*.* .\dist\tests\ -ErrorAction SilentlyContinue

    - name: Save repository metadata for release env-vars
      shell: powershell
      run: |
        "release_version=2.7.$(git rev-list --count --all)" | Out-File -Encoding ascii dist/.env
        "git_short_hash=$(git rev-parse --short HEAD)" | Add-Content -Encoding ascii dist/.env
        "git_branch=$(git branch --show-current)" | Add-Content -Encoding ascii dist/.env
        Get-Content dist/.env

    - name: Deploy distribution binaries
      uses: actions/upload-artifact@v4
      with:
        name: dist-x64
        include-hidden-files: true
        path: |
          dist/

    - name: Deploy PyAfipWs Installer
      uses: actions/upload-artifact@v4
      with:
        name: PyAfipWs-Installer-x64
        path: |
          **/PyAfipWs-*.exe

  pre-release:
    name: Pre Release
    needs: compile
    runs-on: ubuntu-latest

    steps:
      - name: Download 64Bit Installer
        uses: actions/download-artifact@v4.1.7
        with:
          name: PyAfipWs-Installer-x64
          path: PyAfipWs-Installer-x64

      - name: Download distribution binaries
        uses: actions/download-artifact@v4.1.7
        with:
          name: dist-x64
          path: dist-64

      - name: Create ZIP archive
        run: |
          zip dist-64.zip -r dist-64

      - name: Set release env-vars
        run: |
          cat dist-64/.env >> $GITHUB_ENV

      - uses: marvinpinto/action-automatic-releases@latest
        if: github.actor != 'dependabot[bot]'
        with:
          repo_token: "${{ secrets.GITHUB_TOKEN }}"
          automatic_release_tag: ${{ (github.ref_name != 'main') && 'beta' || 'latest' }}
          prerelease: ${{ (github.ref_name != 'main') }}
          title: "Dev Build ${{ env.release_version }} ${{ env.git_branch }} @ ${{ env.git_short_hash }}"
          files: |
            PyAfipWs-Installer-x64/**/*.exe
            dist-64.zip
